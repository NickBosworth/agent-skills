name: Library quality
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/run_checks.py
      - run: python tools/check_library.py --history
      - run: python tools/release.py --out "$RUNNER_TEMP/agentic-skills.zip"
  credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan all reachable history with values redacted
        run: '"$(go env GOPATH)/bin/gitleaks" git . --redact --log-opts=--all'

  seo-workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/seo-workbench
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: products/seo-workbench/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: WORKBENCH_BROWSER_TESTS=1 npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

  seo-workbench-portability:
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        working-directory: products/seo-workbench
    env:
      WORKBENCH_PACKAGE_TESTS: '1'
      WORKBENCH_BROWSER_TESTS: '1'
      WORKBENCH_PYTHON: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: products/seo-workbench/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Install Chromium for native sandboxed browser checks
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --omit=dev

  clean-code-dot-net:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: |
            8.0.415
            10.0.400
      - name: Verify isolated C# fixtures and verifier failures
        env:
          DNC_DOTNET_TESTS: '1'
        run: python -m unittest discover -s skills/agentic-skills-clean-code-dot-net/tests -p 'test_*.py' -v
