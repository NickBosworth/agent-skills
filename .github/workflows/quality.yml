name: Library quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/run_checks.py
      - run: python tools/check_library.py --history
      - run: python tools/release.py --out "$RUNNER_TEMP/agentic-skills.zip"
  credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan all reachable history with values redacted
        run: '"$(go env GOPATH)/bin/gitleaks" git . --redact --log-opts=--all'
