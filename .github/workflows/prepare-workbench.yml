name: Prepare SEO Workbench candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  package:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/seo-workbench
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: products/seo-workbench/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: WORKBENCH_PACKAGE_TESTS=1 npm test
      - run: python3 tools/prepare_release.py --out "$RUNNER_TEMP/seo-workbench-candidate.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seo-workbench-candidate
          path: '${{ runner.temp }}/seo-workbench-candidate.zip'
          if-no-files-found: error
          retention-days: 7
