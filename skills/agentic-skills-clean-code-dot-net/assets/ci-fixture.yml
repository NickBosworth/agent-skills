# Concrete package-fixture CI example; no permission to change branch protection.
name: Clean Code fixture
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: |
            8.0.415
            10.0.400
      - name: Run SDK/helper regression suite in disposable workspaces
        env:
          DNC_DOTNET_TESTS: '1'
        run: python -m unittest discover -s skills/agentic-skills-clean-code-dot-net/tests -p 'test_*.py' -v
